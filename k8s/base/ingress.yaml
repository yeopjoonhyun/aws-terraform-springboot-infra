# ALB Controller가 이 Ingress를 보고 인터넷용 ALB를 만든다. Terraform이 모르는 ALB라 지울 때는 teardown.sh로 먼저 지운다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saa-notes
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # 노드를 거치지 않고 파드 IP로 바로 보낸다
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/tags: Project=aws-tf-springboot
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saa-notes
                port: { number: 80 }
