# ECS 자동 확장과 같은 기준: 평균 CPU 60%, 2~4개
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saa-notes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saa-notes
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
