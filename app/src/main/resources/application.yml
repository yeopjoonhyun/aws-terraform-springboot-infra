server:
  port: 8080

spring:
  application:
    name: saa-notes

  # 기본값은 메모리 DB. 컨테이너를 재시작하면 데이터가 초기화된다.
  # AWS에서는 prod 프로필(application-prod.yml)이 MySQL로 바꾼다.
  # 드라이버는 url을 보고 자동으로 고른다.
  datasource:
    url: jdbc:h2:mem:notesdb
    username: sa

  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
