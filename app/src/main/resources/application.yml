server:
  port: 8080

spring:
  application:
    name: saa-notes

  # 기본값은 메모리 DB. 컨테이너를 재시작하면 데이터가 초기화된다.
  # AWS에서는 prod 프로필(application-prod.yml)이 MySQL로 바꾼다.
  # 드라이버는 url을 보고 자동으로 고른다.
  datasource:
    url: jdbc:h2:mem:notesdb
    username: sa

  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        # /livez, /readyz 를 앱 포트(8080)에도 연다. EKS는 관리 포트를 8081로 옮기므로
        # 로드 밸런서와 쿠버네티스 상태 검사는 이 두 경로를 쓴다.
        add-additional-paths: true
  # 응답 시간 분포(히스토그램)를 내보내야 Prometheus가 p95 응답 시간을 계산할 수 있다.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
