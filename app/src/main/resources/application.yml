server:
  port: 8080

spring:
  application:
    name: saa-notes

  # 기본값은 메모리 DB. 컨테이너를 재시작하면 데이터가 초기화된다.
  # RDS 단계에서는 환경 변수(SPRING_DATASOURCE_URL 등)로 덮어쓴다.
  datasource:
    url: jdbc:h2:mem:notesdb
    driver-class-name: org.h2.Driver
    username: sa

  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
