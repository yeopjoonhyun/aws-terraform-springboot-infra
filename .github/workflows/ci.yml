# CI: PR과 main 푸시마다 코드가 깨지지 않았는지 확인한다.
# CD: main에 들어온 커밋만 ECR에 이미지를 올리고, app(ECS)이 켜져 있으면 배포까지 한다.
#     AWS에는 장기 키 없이 OIDC로 들어간다. main 브랜치 실행만 배포 역할을 맡을 수 있다 (docs/07-cicd.md).
#     PR에서는 비밀값을 쓰지 않는다.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # 문서만 바뀐 커밋은 빌드, 배포하지 않는다 (ECR에 쓸모없는 이미지가 쌓이지 않게)
    paths-ignore: ["docs/**", "**.md"]

# 이 워크플로는 저장소를 읽기만 한다 (최소 권한)
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 서드파티 액션은 버전 이름(v7) 대신 커밋 해시로 고정한다. 이름은 나중에 다른 코드로 바뀔 수 있다.
jobs:
  test:
    name: 앱 테스트
    runs-on: ubuntu-24.04
    container: gradle:9-jdk21 # Dockerfile 빌드 단계와 같은 이미지
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gradle test
        working-directory: app
        run: gradle test --no-daemon

  image:
    name: ARM 이미지 빌드
    runs-on: ubuntu-24.04-arm # ECS가 ARM64라서 같은 구조에서 빌드한다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build -t saa-notes:${GITHUB_SHA::7} app

  deploy:
    name: ECR 푸시, ECS 배포
    needs: [test, image, terraform] # 검사가 모두 통과해야 배포한다
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # GitHub에 OIDC 토큰을 요청할 권한. 이 작업에만 준다
    env:
      AWS_REGION: ap-southeast-2
      CLUSTER: aws-tf-springboot-cluster
      SERVICE: aws-tf-springboot-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 토큰을 AWS에 보내 1시간짜리 임시 키를 받는다. 역할 ARN에 계정 번호가 있어 비밀값에 둔다
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      # ARM 러너 이미지에 AWS CLI가 없을 수도 있어서 없으면 설치한다
      - name: AWS CLI 확인
        run: aws --version || { curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o awscli.zip && unzip -q awscli.zip && sudo ./aws/install; }

      # 저장소가 Public이라 실행 로그도 공개된다. 계정 번호가 로그에 찍히지 않게 가린다.
      - name: ECR 주소 준비
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACCOUNT"
          echo "REGISTRY=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # ECR은 IMMUTABLE이라 같은 태그를 다시 올릴 수 없다. 재실행이면 푸시를 건너뛴다.
      - name: 이미지 빌드, 푸시
        run: |
          REPO=$REGISTRY/aws-tf-springboot-app
          if aws ecr describe-images --repository-name aws-tf-springboot-app --image-ids imageTag=$TAG >/dev/null 2>&1; then
            echo "이미 있는 태그 $TAG, 푸시 건너뜀"
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
            docker build -t "${REPO}:${TAG}" app
            docker push "${REPO}:${TAG}"
          fi

      # app 루트는 쓸 때만 켜므로 꺼져 있으면 배포를 건너뛴다 (실패가 아니다).
      - name: ECS 배포
        run: |
          STATUS=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query 'services[0].status' --output text 2>/dev/null || true)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::notice::app이 꺼져 있어 배포를 건너뜀. 이미지 $TAG 는 ECR에 있다."
            exit 0
          fi
          # 지금 작업 정의를 그대로 복사하고 이미지 태그만 바꿔 새 버전으로 등록한다
          CURRENT=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT" --query taskDefinition \
            | jq --arg img "$REGISTRY/aws-tf-springboot-app:$TAG" '.containerDefinitions[0].image = $img
                | {family, containerDefinitions, executionRoleArn, networkMode, requiresCompatibilities, cpu, memory, runtimePlatform}' > td.json
          NEW=$(aws ecs register-task-definition --cli-input-json file://td.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --task-definition "$NEW" >/dev/null
          echo "새 작업으로 교체 중. 안정될 때까지 기다린다 (최대 10분)"
          aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE
          echo "배포 완료: $TAG"

  terraform:
    name: Terraform 형식, 문법 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - name: terraform fmt
        run: terraform fmt -check -recursive
      # backend=false: state(S3)에 접속하지 않고 코드 문법만 본다
      - name: terraform validate
        run: |
          for dir in bootstrap terraform/network terraform/registry terraform/data terraform/app terraform/eks; do
            echo "== $dir"
            terraform -chdir=$dir init -backend=false -input=false >/dev/null
            terraform -chdir=$dir validate
          done
      # 쿠버네티스 매니페스트가 Kustomize로 펼쳐지는지 본다 (러너에 kubectl이 있다)
      - name: kustomize build
        run: kubectl kustomize k8s/overlays/prod >/dev/null
